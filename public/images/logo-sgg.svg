<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradien Hijau SGG -->
    <linearGradient id="sggGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008A45" />
      <stop offset="100%" stop-color="#005C2E" />
    </linearGradient>

    <!-- Gradien Magenta Accent -->
    <linearGradient id="sggMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#008A45" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- IKON LOGO ONLY -->
  <g filter="url(#softShadow)">
    <!-- Container Kotak Melengkung Hijau SGG -->
    <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#sggGreen)" />

    <!-- Pita Inisial 'S' Putih -->
    <path d="M 60,28 C 43,24 30,35 30,46 C 30,62 60,55 60,69 C 60,78 47,80 30,78" 
          fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Aksen Lengkung Magenta di Bawah -->
    <path d="M 60,69 C 60,78 49,80 37,78" 
          fill="none" stroke="url(#sggMagenta)" stroke-width="5" stroke-linecap="round" />

    <!-- Pulse Dot Indicator Magenta di Atas -->
    <circle cx="66" cy="26" r="7" fill="url(#sggMagenta)" stroke="#FFFFFF" stroke-width="2.5" />
  </g>
</svg>
